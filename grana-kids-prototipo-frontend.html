<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grana Kids — Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --page:#EDEAE0;
  --bg:#FFF6E9; --bg-adult:#F2F6F4; --surface:#FFFFFF;
  --ink:#16231F; --ink-soft:#4E6059; --ink-faint:#8B9A93;
  --primary:#1B7A62; --primary-dark:#124F40; --primary-soft:#E3F3EC;
  --gold:#F2B134; --gold-ink:#8A5A05; --gold-soft:#FDF0D2;
  --coral:#C43B27; --coral-soft:#FDE7E2;
  --line:#EAE2D0; --line-adult:#DEE7E2;
  --success:#2E9E6D; --success-ink:#1D6E4C; --success-bg:#E1F4EB;
  --pending:#8A5A05; --pending-bg:#FDEFCF;
  --danger:#A5352B; --danger-bg:#FBE6E3;
  --saldo-grad:linear-gradient(135deg, #1B7A62 0%, #124F40 100%);
  --nav-active-bg:#E3F3EC; --nav-active-ink:#124F40; --focus:#124F40;
  --ui:1;
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
  --shadow:0 1px 2px rgba(22,35,31,.06), 0 6px 16px rgba(22,35,31,.07);
  --font-display:'Baloo 2', ui-rounded, 'Segoe UI Rounded', system-ui, sans-serif;
  --font-body:'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
/* Tema ESCURO refinado (alto contraste) */
html[data-theme="dark"] {
  --page: #121214;
  --bg: #1A1D20; 
  --bg-adult: #161B19; 
  --surface: #24282D;
  --ink: #F0F4F2; 
  --ink-soft: #A0ACB0; 
  --ink-faint: #6C7A80;
  --primary: #2ECC71; 
  --primary-dark: #27AE60; 
  --primary-soft: #1B382B;
  --gold: #F1C40F; 
  --gold-ink: #F39C12; 
  --gold-soft: #38301B;
  --coral: #E74C3C; 
  --coral-soft: #381E1C;
  --line: #2D3339; 
  --line-adult: #25332E;
  --success: #2ECC71; 
  --success-ink: #2ECC71; 
  --success-bg: #1B382B;
  --pending: #F1C40F; 
  --pending-bg: #38301B;
  --danger: #E74C3C; 
  --danger-bg: #381E1C;
  --saldo-grad: linear-gradient(135deg, #1E824C 0%, #145A32 100%);
  --nav-active-bg: #1B382B; 
  --nav-active-ink: #2ECC71; 
  --focus: #2ECC71;
  --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}
html[data-theme="dark"] .app-shell.theme-adult{ --surface:#1B2422; --ink:#EDF3F0; --ink-soft:#AEBDB7; }

html[data-cb="on"]{
  --success:#00507D; --success-ink:#00507D; --success-bg:#DCEBF5;
  --pending:#8A5300; --pending-bg:#FCEBD0;
  --danger:#8A3F68; --danger-bg:#F7E2EE;
  --coral:#8A3F68;
}
html[data-cb="on"][data-theme="dark"]{
  --success:#7EC8ED; --success-ink:#7EC8ED; --success-bg:#122A38;
  --pending:#F2C177; --pending-bg:#3A2A10;
  --danger:#EBAFD2; --danger-bg:#391B2E;
  --coral:#EBAFD2;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--page); font-family:var(--font-body); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
img,svg{display:block;}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

/* ============ STAGE / APP SHELL ============ */
#stage{min-height:100vh; display:flex; justify-content:center; align-items:flex-start; padding:0;}
.app-shell{
  zoom:var(--ui);
  width:calc(100% / var(--ui)); max-width:460px; height:calc(100vh / var(--ui));
  background:var(--bg);
  position:relative; display:flex; flex-direction:column; overflow:hidden;
  transition:background .25s ease;
}
@media (min-width:640px){
  #stage{ align-items:center; padding:36px 16px; }
  .app-shell{ height:calc(860px / var(--ui)); border-radius:36px; box-shadow:0 24px 70px rgba(20,25,22,.28); border:1px solid rgba(0,0,0,.05); }
}
.app-shell.theme-adult{ background:var(--bg-adult); }

.screen{flex:1; overflow-y:auto; padding:14px 18px 18px; -webkit-overflow-scrolling:touch;}
.screen.no-nav-pad{padding-bottom:24px;}
.screen::-webkit-scrollbar{width:0;}

/* ============ TOPBAR ============ */
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:16px 18px 8px; position:sticky; top:0; z-index:6; background:var(--bg);
}
.theme-adult .topbar{background:var(--bg-adult);}
.icon-btn{
  width:42px; height:42px; border-radius:var(--r-pill); border:none; background:var(--surface);
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); color:var(--ink); position:relative; flex:none;
}
.icon-btn:active{transform:scale(.94);}
.avatar-chip{
  width:42px; height:42px; border-radius:var(--r-pill); background:var(--primary-soft); border:2px solid var(--surface);
  display:flex; align-items:center; justify-content:center; font-size:20px; box-shadow:var(--shadow); flex:none; padding:0;
}
.theme-adult .avatar-chip{background:#E4EEEA;}
.topbar-title{font-family:var(--font-display); font-weight:700; font-size:19px; text-align:center; flex:1; min-width:0; line-height:1.2; overflow-wrap:anywhere;}
.theme-adult .topbar-title{font-family:var(--font-body); font-weight:800; font-size:17px;}
.badge-dot{
  position:absolute; top:-2px; right:-2px; min-width:16px; height:16px; padding:0 3px; border-radius:var(--r-pill);
  background:var(--coral); color:#fff; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; border:2px solid var(--bg);
}

/* ============ BOTTOM NAV ============ */
.bottomnav{
  display:flex; justify-content:space-between; align-items:stretch; padding:8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
  background:var(--surface); border-top:1px solid var(--line); position:sticky; bottom:0; z-index:6;
}
.theme-adult .bottomnav{border-top:1px solid var(--line-adult);}
.nav-btn{
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:3px;
  background:none; border:none; color:var(--ink-faint);
  font-size:11px; font-weight:800; padding:7px 6px; border-radius:14px;
  flex:1 1 0; min-width:0; text-align:center; line-height:1.15; hyphens:auto;
}
.nav-btn[aria-current="page"]{color:var(--nav-active-ink); background:var(--nav-active-bg);}
.theme-adult .nav-btn[aria-current="page"]{color:var(--nav-active-ink); background:var(--nav-active-bg);}

/* ============ TYPO ============ */
h1,h2,h3{font-family:var(--font-display); margin:0 0 4px; font-weight:700; color:var(--ink);}
.theme-adult h1, .theme-adult h2, .theme-adult h3{font-family:var(--font-body); font-weight:800;}
h1{font-size:24px;} h2{font-size:18px;} h3{font-size:15px;}
p{margin:0; line-height:1.45;}
.muted{color:var(--ink-soft); font-size:13px;}
.section-title{display:flex; align-items:baseline; justify-content:space-between; margin:22px 0 10px;}
.section-title h2{margin:0;}
.link-btn{background:none; border:none; color:var(--primary); font-weight:800; font-size:13px; padding:4px 2px;}
.theme-adult .link-btn{color:var(--primary-dark);}

/* ============ CARDS ============ */
.card{background:var(--surface); border-radius:var(--r-md); padding:14px 16px; box-shadow:var(--shadow); margin-bottom:10px;}
.card-tight{padding:12px 14px;}
.row{display:flex; align-items:center; gap:10px;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.stack{display:flex; flex-direction:column; gap:2px; min-width:0;}
.ellipsis{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* saldo hero lúdico (Prioridade 1) */
.age-small .saldo-card, .age-mid .saldo-card {
  background: linear-gradient(135deg, #FF7E5F 0%, #FEB47B 100%) !important;
  border-radius: 24px;
  box-shadow: 0 10px 20px rgba(255, 126, 95, 0.3);
  position: relative;
  overflow: hidden;
}
.age-small .saldo-card::after, .age-mid .saldo-card::after {
  content: "⭐";
  position: absolute;
  right: -10px;
  bottom: -15px;
  font-size: 80px;
  opacity: 0.25;
  pointer-events: none;
}
.saldo-card{
  background:var(--saldo-grad); color:#fff; border-radius:var(--r-lg);
  padding:20px; box-shadow:var(--shadow); margin-bottom:6px;
}
.saldo-card .muted{color:rgba(255,255,255,.78);}
.saldo-valor{font-family:var(--font-display); font-size:34px; font-weight:800; margin-top:2px; display:flex; align-items:center; gap:8px; white-space:nowrap;}
.theme-adult .saldo-card{background:var(--saldo-grad);}
.theme-adult .saldo-valor{font-family:var(--font-body); font-weight:900;}

/* pills */
.pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:800; padding:4px 10px; border-radius:var(--r-pill); white-space:nowrap;}
.pill-pending{background:var(--pending-bg); color:var(--pending);}
.pill-success{background:var(--success-bg); color:var(--success-ink);}
.pill-danger{background:var(--danger-bg); color:var(--danger);}
.pill-neutral{background:#EEF1EF; color:var(--ink-soft);}

/* progress */
.progress-track{height:10px; border-radius:var(--r-pill); background:var(--line); overflow:hidden; margin:8px 0 4px;}
.theme-adult .progress-track{background:var(--line-adult);}
.progress-fill{height:100%; background:linear-gradient(90deg, var(--gold), var(--primary)); border-radius:var(--r-pill);}

/* buttons */
.btn{border:none; border-radius:var(--r-pill); font-weight:800; font-size:14px; padding:12px 18px; display:inline-flex; align-items:center; justify-content:center; gap:6px; width:100%; transition:transform .15s ease, box-shadow .15s ease;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:active{background:var(--primary-dark);}
.theme-adult .btn-primary{background:var(--primary-dark);}
.btn-secondary{background:var(--surface); color:var(--ink); border:1.5px solid var(--line);}
.theme-adult .btn-secondary{border-color:var(--line-adult);}
.btn-ghost{background:none; color:var(--primary); font-weight:800; border:none;}
.theme-adult .btn-ghost{color:var(--primary-dark);}
.btn-danger-outline{background:var(--danger-bg); color:var(--danger);}
.btn-success-outline{background:var(--success-bg); color:var(--success-ink);}
.btn-sm{padding:8px 12px; font-size:13px; width:auto;}
.btn-row{display:flex; gap:8px;}
.btn-row .btn{flex:1;}
.fab-row{margin:14px 0;}

/* task/goal/request card variants by status */
.tile{border-radius:var(--r-md); padding:14px; margin-bottom:10px; box-shadow:var(--shadow); transition:transform .15s ease;}
.tile:active{transform:scale(0.98);}
.tile-pending{background:var(--pending-bg);}
.tile-success{background:var(--success-bg);}
.tile-danger{background:var(--danger-bg);}
.tile-neutral{background:var(--surface);}
.tile-title{font-weight:800; font-size:15px; margin-bottom:2px;}
.tile-desc{font-size:13px; color:var(--ink-soft); margin-bottom:8px;}
.tile-foot{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.reward{font-weight:800; font-size:13px; display:flex; align-items:center; gap:4px;}

/* forms */
.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; font-weight:800; margin-bottom:6px; color:var(--ink);}
.field .hint{font-size:12px; color:var(--ink-soft); margin-top:5px;}
.input-wrap{position:relative;}
.field input, .field select, .field textarea{
  width:100%; padding:12px 14px; border-radius:var(--r-sm); border:1.5px solid var(--line); background:var(--surface);
  font-size:15px; color:var(--ink);
}
.theme-adult .field input, .theme-adult .field select, .theme-adult .field textarea{border-color:var(--line-adult);}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);}
.field textarea{resize:vertical; min-height:64px;}
.eye-toggle{position:absolute; right:8px; top:6px; background:none; border:none; width:34px; height:34px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); border-radius:var(--r-pill);}

/* auth screens */
.auth-wrap{padding:0 22px; min-height:100%; display:flex; flex-direction:column;}
.auth-hero{padding:34px 0 18px; text-align:center;}
.logo-mark{width:64px; height:64px; margin:0 auto 12px; border-radius:20px; background:var(--primary); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);}
.auth-hero h1{font-size:26px;}
.demo-box{border:1.5px dashed var(--line); border-radius:var(--r-md); padding:12px 14px; margin-top:18px; background:rgba(255,255,255,.5);}
.demo-box p{font-size:12px; color:var(--ink-soft); margin-bottom:8px;}

/* notif dropdown */
.notif-panel{
  position:absolute; top:52px; right:-4px; width:min(290px, 82vw); background:var(--surface); border-radius:var(--r-md);
  box-shadow:0 10px 30px rgba(20,25,22,.22); z-index:20; overflow:hidden; border:1px solid var(--line);
}
.notif-panel h3{padding:14px 16px 8px; margin:0; border-bottom:1px solid var(--line);}
.notif-item{padding:12px 16px; border-bottom:1px solid var(--line); font-size:13px; display:flex; gap:8px; align-items:flex-start;}
.notif-item:last-child{border-bottom:none;}
.notif-dot{width:8px; height:8px; border-radius:50%; background:var(--coral); margin-top:5px; flex:none;}
.notif-empty{padding:20px 16px; text-align:center; color:var(--ink-soft); font-size:13px;}

/* modal / sheet */
.overlay{position:absolute; inset:0; background:rgba(16,24,20,.45); z-index:30; display:flex; align-items:flex-end; justify-content:center;}
@media (min-width:640px){ .overlay{align-items:center;} }
.sheet{
  background:var(--surface); width:100%; max-width:460px; border-radius:22px 22px 0 0; padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));
  max-height:88vh; overflow-y:auto; box-shadow:0 -10px 40px rgba(0,0,0,.25);
}
@media (min-width:640px){ .sheet{border-radius:22px; max-height:80vh;} }
.sheet-handle{width:40px; height:4px; background:var(--line); border-radius:var(--r-pill); margin:0 auto 14px;}
.sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}

/* toast */
#toast-host{position:fixed; top:18px; left:0; right:0; display:flex; justify-content:center; z-index:60; pointer-events:none;}
.toast{background:var(--ink); color:#fff; padding:11px 18px; border-radius:var(--r-pill); font-size:13px; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,.3); max-width:88%; text-align:center;}

/* ---- adaptação por faixa etária ---- */
.age-small{ --r-md:20px; --r-lg:26px; }
.age-small .screen{ font-size:17px; }
.age-small h1{font-size:27px;} .age-small h2{font-size:21px;}
.age-small .btn{ padding:15px 20px; font-size:16px; }
.age-small .tile-title{ font-size:17px; }
.age-small .tile-desc, .age-small .muted{ font-size:15px; }
.age-small .nav-btn{ font-size:12px; padding:9px 12px; }
.age-small .saldo-valor{ font-size:38px; }
.age-mid .screen{ font-size:15px; }
.age-big .screen{ font-size:15px; }
.age-big h1{font-size:22px;} .age-big h2{font-size:17px;}
.age-big .topbar-title, .age-big h1, .age-big h2, .age-big h3{ font-family:var(--font-body); font-weight:800; }
.age-big .saldo-valor{ font-family:var(--font-body); font-weight:900; font-size:30px; }

/* ---- ajustes finos para escalas de interface ampliadas ---- */
.ui-lg .nav-btn{ font-size:10px; }
.ui-lg .saldo-valor{ font-size:30px; }
.ui-xl .nav-btn{ font-size:9px; gap:2px; padding:7px 3px; }
.ui-xl .saldo-valor{ font-size:26px; }
.ui-xl h1{ font-size:21px; } .ui-xl h2{ font-size:17px; }
.ui-xl .topbar-title{ font-size:16px; }
.ui-xl.age-small .screen, .ui-xl .screen{ font-size:15px; }

/* mascote lúdico animado (Prioridade 1) */
.mascote{ display:flex; align-items:center; justify-content:flex-end; gap:8px; margin:2px 0 10px; }
.mascote-bolha{
  background:var(--surface); border-radius:var(--r-pill); padding:9px 14px; font-size:14px; font-weight:700;
  box-shadow:var(--shadow); color:var(--ink); border: 2px solid var(--gold);
}
.mascote-emoji{ font-size:40px; line-height:1; animation: bounce 2s infinite ease-in-out; }
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* linha de opção (configurações) */
.opt-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); }
.opt-row:last-child{ border-bottom:none; }
.theme-adult .opt-row{ border-bottom-color:var(--line-adult); }
.opt-text{ min-width:0; }
.opt-text strong{ display:block; font-size:14px; }
.opt-text span{ font-size:12.5px; color:var(--ink-soft); }
.switch{
  flex:none; width:54px; height:31px; border-radius:var(--r-pill); border:2px solid var(--line); background:var(--line);
  position:relative; padding:0; transition:background .2s ease, border-color .2s ease;
}
.theme-adult .switch{ border-color:var(--line-adult); background:var(--line-adult); }
.switch[aria-checked="true"]{ background:var(--primary); border-color:var(--primary); }
.switch .knob{
  position:absolute; top:2px; left:2px; width:23px; height:23px; border-radius:50%; background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.35); transition:transform .2s ease;
}
.switch[aria-checked="true"] .knob{ transform:translateX(23px); }
.seg{ display:flex; flex-wrap:wrap; gap:6px; background:var(--line); padding:4px; border-radius:var(--r-lg); }
.theme-adult .seg{ background:var(--line-adult); }
.seg button{
  flex:1 1 auto; min-width:86px; border:none; background:none; padding:9px 10px; border-radius:var(--r-pill);
  font-weight:800; font-size:13px; color:var(--ink-soft); white-space:nowrap;
}
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }

/* misc */
.empty-state{text-align:center; padding:34px 12px; color:var(--ink-soft);}
.empty-state .big-emoji{font-size:38px; display:block; margin-bottom:10px;}
.divider{height:1px; background:var(--line); margin:18px 0;}
.theme-adult .divider{background:var(--line-adult);}
.avatar-lg{width:88px; height:88px; border-radius:50%; background:var(--primary-soft); display:flex; align-items:center; justify-content:center; font-size:42px; margin:0 auto; border:3px solid var(--surface); box-shadow:var(--shadow);}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0;}
.stat-box{background:var(--surface); border-radius:var(--r-md); padding:14px; box-shadow:var(--shadow);}
.stat-num{font-family:var(--font-body); font-weight:900; font-size:22px; color:var(--primary-dark);}
.stat-label{font-size:12px; color:var(--ink-soft); font-weight:700; margin-top:2px;}
.swatch-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}
.swatch{width:44px; height:44px; border-radius:50%; border:3px solid transparent; display:flex; align-items:center; justify-content:center; font-size:20px; background:var(--surface); box-shadow:var(--shadow);}
.swatch[aria-pressed="true"]{border-color:var(--primary-dark);}
.chip-select{display:flex; align-items:center; gap:10px; background:var(--surface); border-radius:var(--r-pill); padding:6px 8px 6px 6px; box-shadow:var(--shadow); width:fit-content;}
.chip-select select{border:none; background:none; font-weight:800; font-size:13px; padding:2px 4px;}
.back-row{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
.donut-wrap{display:flex; align-items:center; gap:16px;}
.donut-legend{font-size:12px; display:flex; flex-direction:column; gap:6px;}
.legend-dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px;}
</style>
</head>
<body>
<div id="stage"><div id="app" class="app-shell" role="application" aria-label="Grana Kids"></div></div>
<div id="toast-host" aria-live="polite"></div>

<script>
/* =====================================================================
   GRANA KIDS — PROTÓTIPO DE FRONT-END (mock, sem back-end real)
   ===================================================================== */

function icon(name, size){
  size = size || 22;
  var s = 'width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
  var paths = {
    home: '<path '+s+' d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z"/></svg>',

}
