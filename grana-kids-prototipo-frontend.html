<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grana Kids — Protótipo frontend aprimorado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --page:#EDEAE0;
  --bg:#FFF6E9; --bg-adult:#F2F6F4; --surface:#FFFFFF;
  --ink:#16231F; --ink-soft:#4E6059; --ink-faint:#8B9A93;
  --primary:#1B7A62; --primary-dark:#124F40; --primary-soft:#E3F3EC;
  --gold:#F2B134; --gold-ink:#8A5A05; --gold-soft:#FDF0D2;
  --coral:#C43B27; --coral-soft:#FDE7E2;
  --line:#EAE2D0; --line-adult:#DEE7E2;
  --success:#2E9E6D; --success-ink:#1D6E4C; --success-bg:#E1F4EB;
  --pending:#8A5A05; --pending-bg:#FDEFCF;
  --danger:#A5352B; --danger-bg:#FBE6E3;
  --saldo-grad:linear-gradient(135deg, #1B7A62 0%, #124F40 100%);
  --nav-active-bg:#E3F3EC; --nav-active-ink:#124F40; --focus:#124F40;
  --ui:1;
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
  --shadow:0 1px 2px rgba(22,35,31,.06), 0 6px 16px rgba(22,35,31,.07);
  --font-display:'Baloo 2', ui-rounded, 'Segoe UI Rounded', system-ui, sans-serif;
  --font-body:'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
/* Tema ESCURO refinado e WCAG compliant */
html[data-theme="dark"] {
  --page: #0B0E0F;
  --bg: #14181B; 
  --bg-adult: #121615; 
  --surface: #1E2327;
  --ink: #E2ECE8; 
  --ink-soft: #9AA8A3; 
  --ink-faint: #63706B;
  --primary: #2ECC71; 
  --primary-dark: #27AE60; 
  --primary-soft: #142B21;
  --gold: #F1C40F; 
  --gold-ink: #F39C12; 
  --gold-soft: #2B2414;
  --coral: #E74C3C; 
  --coral-soft: #2B1715;
  --line: #2A3137; 
  --line-adult: #1F2A26;
  --success: #2ECC71; 
  --success-ink: #2ECC71; 
  --success-bg: #142B21;
  --pending: #F1C40F; 
  --pending-bg: #2B2414;
  --danger: #E74C3C; 
  --danger-bg: #2B1715;
  --saldo-grad: linear-gradient(135deg, #165B3E 0%, #0E3B28 100%);
  --nav-active-bg: #142B21; 
  --nav-active-ink: #2ECC71; 
  --focus: #2ECC71;
  --shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
}
html[data-theme="dark"] .app-shell.theme-adult{ --surface:#171F1D; --ink:#E2ECE8; --ink-soft:#9AA8A3; }

/* Paletas acessíveis selecionáveis: protanopia, deuteranopia e tritanopia.
   Estados também usam texto, ícones e bordas, nunca apenas a cor. */
html[data-cb="protanopia"]{
  --primary:#176B8A; --primary-dark:#124F68; --primary-soft:#DCEFF5;
  --success:#176B8A; --success-ink:#124F68; --success-bg:#DCEFF5;
  --pending:#8A5700; --pending-bg:#FFF0D1; --danger:#704A9B; --danger-bg:#EEE5F7;
  --coral:#704A9B; --gold:#8A5700; --gold-ink:#704600; --gold-soft:#FFF0D1;
  --nav-active-bg:#DCEFF5; --nav-active-ink:#124F68; --focus:#176B8A;
}
html[data-cb="deuteranopia"]{
  --primary:#176B8A; --primary-dark:#124F68; --primary-soft:#DCEFF5;
  --success:#176B8A; --success-ink:#124F68; --success-bg:#DCEFF5;
  --pending:#9A5A00; --pending-bg:#FFF0D1; --danger:#8A3F68; --danger-bg:#F7E2EE;
  --coral:#8A3F68; --gold:#9A5A00; --gold-ink:#704600; --gold-soft:#FFF0D1;
  --nav-active-bg:#DCEFF5; --nav-active-ink:#124F68; --focus:#176B8A;
}
html[data-cb="tritanopia"]{
  --primary:#176B4B; --primary-dark:#12563C; --primary-soft:#DDF2E7;
  --success:#176B4B; --success-ink:#12563C; --success-bg:#DDF2E7;
  --pending:#8A5700; --pending-bg:#FFF0D1; --danger:#9B3F35; --danger-bg:#F9E5E1;
  --coral:#9B3F35; --gold:#8A5700; --gold-ink:#704600; --gold-soft:#FFF0D1;
  --nav-active-bg:#DDF2E7; --nav-active-ink:#12563C; --focus:#176B4B;
}
html[data-theme="dark"][data-cb="protanopia"],html[data-theme="dark"][data-cb="deuteranopia"]{
  --primary:#83CBE2; --primary-dark:#83CBE2; --primary-soft:#142D37;
  --success:#83CBE2; --success-ink:#83CBE2; --success-bg:#142D37;
  --pending:#F0C477; --pending-bg:#382B16; --danger:#D4B2EE; --danger-bg:#30233D;
  --coral:#D4B2EE; --gold:#F0C477; --gold-ink:#F0C477; --gold-soft:#382B16;
  --nav-active-bg:#142D37; --nav-active-ink:#83CBE2; --focus:#83CBE2;
}
html[data-theme="dark"][data-cb="tritanopia"]{
  --primary:#80D5A8; --primary-dark:#80D5A8; --primary-soft:#142D22;
  --success:#80D5A8; --success-ink:#80D5A8; --success-bg:#142D22;
  --pending:#F0C477; --pending-bg:#382B16; --danger:#F0A69B; --danger-bg:#3A211E;
  --coral:#F0A69B; --gold:#F0C477; --gold-ink:#F0C477; --gold-soft:#382B16;
  --nav-active-bg:#142D22; --nav-active-ink:#80D5A8; --focus:#80D5A8;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--page); font-family:var(--font-body); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
img,svg{display:block;}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

/* ============ STAGE / APP SHELL ============ */
#stage{min-height:100vh; display:flex; justify-content:center; align-items:flex-start; padding:0;}
.app-shell{
  zoom:var(--ui);
  width:calc(100% / var(--ui)); max-width:460px; height:calc(100vh / var(--ui));
  background:var(--bg);
  position:relative; display:flex; flex-direction:column; overflow:hidden;
  transition:background .25s ease;
}
@media (min-width:640px){
  #stage{ align-items:center; padding:36px 16px; }
  .app-shell{ height:calc(860px / var(--ui)); border-radius:36px; box-shadow:0 24px 70px rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.05); }
}
.app-shell.theme-adult{ background:var(--bg-adult); }

.screen{flex:1; overflow-y:auto; padding:14px 18px 18px; -webkit-overflow-scrolling:touch;}
/* A tela e seus elementos entram juntos, com duração e curva idênticas. */
@keyframes screen-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes surface-enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.app-shell.screen-transition .screen{animation:screen-enter .34s cubic-bezier(.22,.72,.25,1) both;}
.app-shell.screen-transition .screen > .card,.app-shell.screen-transition .screen > .tile,.app-shell.screen-transition .screen > .saldo-card,.app-shell.screen-transition .screen > .goal-card{animation:surface-enter .34s cubic-bezier(.22,.72,.25,1) both;}
.screen.no-nav-pad{padding-bottom:24px;}
.screen::-webkit-scrollbar{width:0;}
.overlay{animation:overlay-enter .30s ease both;}
.sheet{animation:sheet-enter .36s cubic-bezier(.2,.8,.25,1) both;transform-origin:bottom center;}
@keyframes overlay-enter{from{opacity:0}to{opacity:1}}
@keyframes sheet-enter{from{opacity:.75;transform:translateY(22px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.app-shell.screen-transition .topbar{animation:topbar-enter .34s cubic-bezier(.22,.72,.25,1) both;}
@keyframes topbar-enter{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.app-shell.screen-transition .screen,.app-shell.screen-transition .screen > .card,.app-shell.screen-transition .screen > .tile,.app-shell.screen-transition .screen > .saldo-card,.app-shell.screen-transition .screen > .goal-card,.overlay,.sheet,.app-shell.screen-transition .topbar{animation:none!important;}}

/* Transições consistentes entre caixas, cartões e opções interativas. */
.card,.tile,.goal-card,.saldo-card,.opt-row,.request-card,.setting-card{
  transition:transform .28s cubic-bezier(.2,.75,.25,1), box-shadow .28s ease,
             background-color .28s ease, border-color .28s ease;
}
@media (prefers-reduced-motion:reduce){
  .card,.tile,.goal-card,.saldo-card,.opt-row,.request-card,.setting-card,
  .btn,.icon-btn,.avatar-chip{transition:none!important;}
}

/* ============ TOPBAR ============ */
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:16px 18px 8px; position:sticky; top:0; z-index:6; background:var(--bg);
}
.theme-adult .topbar{background:var(--bg-adult);}
.icon-btn{
  width:42px; height:42px; border-radius:var(--r-pill); border:none; background:var(--surface);
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); color:var(--ink); position:relative; flex:none;
}
.icon-btn:active{transform:scale(.94);}
.avatar-chip{
  width:42px; height:42px; border-radius:var(--r-pill); background:var(--primary-soft); border:2px solid var(--surface);
  display:flex; align-items:center; justify-content:center; font-size:20px; box-shadow:var(--shadow); flex:none; padding:0;
}
.theme-adult .avatar-chip{background:var(--primary-soft);}
.topbar-title{font-family:var(--font-display); font-weight:700; font-size:19px; text-align:center; flex:1; min-width:0; line-height:1.2; overflow-wrap:anywhere;}
.theme-adult .topbar-title{font-family:var(--font-body); font-weight:800; font-size:17px;}
.badge-dot{
  position:absolute; top:-2px; right:-2px; min-width:16px; height:16px; padding:0 3px; border-radius:var(--r-pill);
  background:var(--coral); color:#fff; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; border:2px solid var(--bg);
}

/* ============ BOTTOM NAV ============ */
.bottomnav{
  display:flex; justify-content:space-between; align-items:stretch; padding:8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
  background:var(--surface); border-top:1px solid var(--line); position:sticky; bottom:0; z-index:6;
}
.theme-adult .bottomnav{border-top:1px solid var(--line-adult);}
.nav-btn{
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:3px;
  background:none; border:none; color:var(--ink-faint);
  font-size:11px; font-weight:800; padding:7px 6px; border-radius:14px;
  flex:1 1 0; min-width:0; text-align:center; line-height:1.15; hyphens:auto;
}
.nav-btn[aria-current="page"]{color:var(--nav-active-ink); background:var(--nav-active-bg);}
.theme-adult .nav-btn[aria-current="page"]{color:var(--nav-active-ink); background:var(--nav-active-bg);}

/* ============ TYPO ============ */
h1,h2,h3{font-family:var(--font-display); margin:0 0 4px; font-weight:700; color:var(--ink);}
.theme-adult h1, .theme-adult h2, .theme-adult h3{font-family:var(--font-body); font-weight:800;}
h1{font-size:24px;} h2{font-size:18px;} h3{font-size:15px;}
p{margin:0; line-height:1.45;}
.muted{color:var(--ink-soft); font-size:13px;}
.section-title{display:flex; align-items:baseline; justify-content:space-between; margin:22px 0 10px;}
.section-title h2{margin:0;}
.link-btn{background:none; border:none; color:var(--primary); font-weight:800; font-size:13px; padding:4px 2px;}
.theme-adult .link-btn{color:var(--primary-dark);}

/* ============ CARDS ============ */
.card{background:var(--surface); border-radius:var(--r-md); padding:14px 16px; box-shadow:var(--shadow); margin-bottom:10px;}
.card-tight{padding:12px 14px;}
.row{display:flex; align-items:center; gap:10px;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.stack{display:flex; flex-direction:column; gap:2px; min-width:0;}
.ellipsis{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* saldo hero lúdico enriquecido */
.age-small .saldo-card, .age-mid .saldo-card {
  background: linear-gradient(135deg, #FF7E5F 0%, #FEB47B 100%) !important;
  border-radius: 24px;
  box-shadow: 0 10px 20px rgba(255, 126, 95, 0.3);
  position: relative;
  overflow: hidden;
  border: 2px solid rgba(255,255,255,0.4);
}
/* Sem foguete decorativo: as estrelas de conquista têm protagonismo. */
.saldo-card{
  background:var(--saldo-grad); color:#fff; border-radius:var(--r-lg);
  padding:20px; box-shadow:var(--shadow); margin-bottom:6px;
}
.saldo-card .muted{color:rgba(255,255,255,.92);}
.saldo-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:1px;}
.saldo-customize{width:34px;height:34px;flex:none;border:1px solid rgba(255,255,255,.58);border-radius:11px;background:rgba(255,255,255,.16);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s ease,transform .2s ease;}
.saldo-customize:hover{background:rgba(255,255,255,.28);transform:translateY(-1px)}
.saldo-customize:focus-visible{outline:3px solid #fff;outline-offset:3px}
.saldo-color-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 18px}
.saldo-color-choice{border:2px solid transparent;border-radius:13px;padding:8px 6px;background:var(--surface);color:var(--ink);font-weight:750;cursor:pointer;text-align:center}
.saldo-color-choice[aria-pressed=true]{border-color:var(--focus);box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 22%,transparent)}
.saldo-color-swatch{height:34px;border-radius:8px;margin-bottom:6px;display:block}
.saldo-future{border:1px dashed var(--line);border-radius:14px;padding:12px;background:var(--surface-2);margin-top:12px}
.saldo-valor{font-family:var(--font-display); font-size:34px; font-weight:800; margin-top:2px; display:flex; align-items:center; gap:8px; white-space:nowrap;}
.theme-adult .saldo-card{background:var(--saldo-grad);}
.theme-adult .saldo-valor{font-family:var(--font-body); font-weight:900;}

/* pills */
.pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:800; padding:4px 10px; border-radius:var(--r-pill); white-space:nowrap;}
.pill-pending{background:var(--pending-bg); color:var(--pending);}
.pill-success{background:var(--success-bg); color:var(--success-ink);}
.pill-danger{background:var(--danger-bg); color:var(--danger);}
.pill-neutral{background:var(--surface); color:var(--ink-soft); border:1px solid var(--line);}

/* progress */
.progress-track{height:12px; border-radius:var(--r-pill); background:var(--line); overflow:hidden; margin:8px 0 4px;}
.theme-adult .progress-track{background:var(--line-adult);}
.progress-fill{height:100%; background:#6F9D70; border-radius:var(--r-pill); transition:width .45s ease, background-color .35s ease;}
/* Recompensas visuais do saldo: área própria, sem sobrepor texto ou valor. */
.saldo-card{position:relative; overflow:hidden; padding-bottom:48px;}
.saldo-stars{position:absolute; right:14px; bottom:9px; display:flex; flex-direction:row-reverse; flex-wrap:nowrap; align-items:center; justify-content:flex-start; gap:clamp(2px, .8vw, 6px); max-width:calc(100% - 28px); overflow:hidden; white-space:nowrap; pointer-events:none;}
.saldo-star{display:inline-flex; align-items:center; justify-content:center; color:#FFE39A; line-height:1; text-shadow:0 1px 3px rgba(0,0,0,.2); flex:none;}
.saldo-star.small{font-size:clamp(13px, 3.5vw, 18px);}
.saldo-star.large{font-size:clamp(19px, 5vw, 27px); color:#FFF0B8;}
.saldo-star-bubble{width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:0;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.34),rgba(255,225,151,.2) 58%,rgba(255,225,151,.08));color:#FFF0B8;font-size:22px;line-height:1;text-shadow:0 1px 5px rgba(112,65,20,.28);box-shadow:0 0 0 1px rgba(255,245,210,.12),0 2px 9px rgba(95,54,20,.12);}
.saldo-star-count{font-size:11px; font-weight:900; color:#fff; background:rgba(20,35,31,.35); border:1px solid rgba(255,255,255,.5); border-radius:999px; padding:3px 6px; flex:none;}
/* Separação visual clara entre ações de configuração no perfil adulto. */
.profile-avatar-action{display:flex;margin:0 auto;border:0;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;}
.profile-avatar-action:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(0,0,0,.14);}
.profile-avatar-action:focus-visible{outline:3px solid var(--focus);outline-offset:4px;}
.profile-actions{display:flex; flex-direction:column; gap:10px; margin-top:18px; padding-top:18px; border-top:1px solid var(--line-adult);}
.profile-actions .btn{min-height:46px; white-space:normal; line-height:1.25;}
.profile-logout{margin-top:26px!important;padding-top:20px;border-top:1px solid var(--line-adult);}
.theme-adult .card .stack strong{color:var(--ink); font-weight:900;}
.theme-adult .card .stack .muted{color:var(--ink-soft);}
/* Bolhas decorativas leves nas áreas de uso; não aparecem em configurações críticas. */
.age-small .screen, .age-mid .screen{
  background-image:
    radial-gradient(circle at 92% 3%, rgba(255,190,120,.13) 0 42px, transparent 43px),
    radial-gradient(circle at 4% 34%, rgba(87,177,145,.11) 0 30px, transparent 31px),
    radial-gradient(circle at 96% 57%, rgba(255,190,120,.09) 0 24px, transparent 25px),
    radial-gradient(circle at 7% 78%, rgba(87,177,145,.08) 0 19px, transparent 20px),
    radial-gradient(circle at 76% 91%, rgba(255,190,120,.08) 0 32px, transparent 33px);
}
.theme-adult .screen:not(:has(.profile-actions)):not(:has(.accessibility-settings)){
  background-image:radial-gradient(circle at 96% 8%, rgba(87,177,145,.07) 0 35px, transparent 36px),radial-gradient(circle at 3% 58%, rgba(255,190,120,.07) 0 24px, transparent 25px);
}
@media (prefers-reduced-transparency: reduce){.age-small .screen,.age-mid .screen,.theme-adult .screen{background-image:none;}}
@media (prefers-reduced-motion:reduce){.progress-fill{transition:none;}}


/* buttons */
.btn{border:none; border-radius:var(--r-pill); font-weight:800; font-size:14px; padding:12px 18px; display:inline-flex; align-items:center; justify-content:center; gap:6px; width:100%; transition:transform .28s cubic-bezier(.2,.75,.25,1), box-shadow .28s ease, background-color .28s ease, border-color .28s ease;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:active{background:var(--primary-dark);}
.theme-adult .btn-primary{background:var(--primary-dark);}
.btn-secondary{background:var(--surface); color:var(--ink); border:1.5px solid var(--line);}
.theme-adult .btn-secondary{border-color:var(--line-adult);}
.btn-ghost{background:none; color:var(--primary); font-weight:800; border:none;}
.theme-adult .btn-ghost{color:var(--primary-dark);}
.btn-danger-outline{background:var(--danger-bg); color:var(--danger);}
.btn-success-outline{background:var(--success-bg); color:var(--success-ink);}
.btn-sm{padding:8px 12px; font-size:13px; width:auto;}
.btn-row{display:flex; gap:8px;}
.btn-row .btn{flex:1;}
.fab-row{margin:14px 0;}

/* task/goal/request card variants by status */
.tile{border-radius:var(--r-md); padding:14px; margin-bottom:10px; box-shadow:var(--shadow); transition:transform .28s cubic-bezier(.2,.75,.25,1), box-shadow .28s ease, background-color .28s ease, border-color .28s ease;}
.tile:active{transform:scale(0.98);}
.tile-pending{background:var(--pending-bg); border-left:4px solid var(--pending);}
.tile-success{background:var(--success-bg); border-left:4px solid var(--success);}
.tile-danger{background:var(--danger-bg); border-left:4px solid var(--danger);}
.tile-neutral{background:var(--surface); border:1px solid var(--line);}
.tile-title{font-weight:800; font-size:15px; margin-bottom:2px;}
.tile-desc{font-size:13px; color:var(--ink-soft); margin-bottom:8px;}
.tile-foot{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.reward{font-weight:800; font-size:13px; display:flex; align-items:center; gap:4px; color:var(--gold-ink);}
html[data-theme="dark"] .reward{color:var(--gold);}

/* forms */
.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; font-weight:800; margin-bottom:6px; color:var(--ink);}
.field .hint{font-size:12px; color:var(--ink-soft); margin-top:5px;}
.input-wrap{position:relative;}
.field input, .field select, .field textarea{
  width:100%; padding:12px 14px; border-radius:var(--r-sm); border:1.5px solid var(--line); background:var(--surface);
  font-size:15px; color:var(--ink);
}
.theme-adult .field input, .theme-adult .field select, .theme-adult .field textarea{border-color:var(--line-adult);}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);}
.field textarea{resize:vertical; min-height:64px;}

function brl(v){ return 'R$ ' + Number(v).toFixed(2).replace('.', ','); }
function pct(dep,total){ return Math.max(0, Math.min(100, Math.round((dep/total)*100))); }

// Escala progressiva suave: informa avanço sem usar cores excessivamente saturadas.
function progressColor(value){
  var p=Math.max(0,Math.min(100,Number(value)||0));
  var stops=[
    {p:0,c:[184,91,91]},    // vermelho suave
    {p:30,c:[199,126,75]},  // laranja queimado
    {p:45,c:[196,164,83]},  // amarelo-âmbar
    {p:65,c:[158,174,112]}, // verde amarelado
    {p:85,c:[111,157,112]}, // verde sálvia
    {p:100,c:[53,119,82]}   // verde profundo
  ];
  var a=stops[0],b=stops[stops.length-1];
  for(var i=0;i<stops.length-1;i++){ if(p>=stops[i].p && p<=stops[i+1].p){a=stops[i];b=stops[i+1];break;} }
  var f=(p-a.p)/(b.p-a.p||1);
  var rgb=a.c.map(function(v,i){return Math.round(v+(b.c[i]-v)*f);});
  return 'rgb('+rgb.join(',')+')';
}
function progressStyle(dep,total){
  var value=pct(dep,total);
  return 'width:'+value+'%;background:'+progressColor(value)+';';
}

// Cada R$ 100 rende uma estrela. A cada cinco estrelas pequenas,
// elas se transformam em uma estrela maior. A fileira cresce da direita
// para a esquerda e limita a quantidade de elementos para não vazar do cartão.
function saldoStars(saldo){
  var total=Math.floor(Math.max(0,Number(saldo)||0)/100);
  var grandes=Math.floor(total/5), pequenas=total%5;
  var html='';
  /* Cada grupo de cinco estrelas vira uma estrela maior; a ordem visual parte da direita. */
  for(var i=0;i<pequenas;i++) html+='<span class="saldo-star small" aria-hidden="true">★</span>';
  for(var j=0;j<grandes;j++) html+='<span class="saldo-star large" aria-hidden="true">★</span>';
  if(grandes>14) html='<span class="saldo-star-count">'+grandes+' estrelas grandes</span>';
  if(!total) return '<div class="saldo-stars" role="img" aria-label="Nenhuma estrela conquistada; a primeira chega aos 100 reais"><span class="saldo-star-bubble">☆</span></div>';
  return '<div class="saldo-stars" role="img" aria-label="'+total+' estrelas conquistadas">'+html+'</div>';
}

function kidReqStatus(status){
  if(status==='pendente') return {pill:'pill-pending', label:'Aguardando'};

  if(status==='aprovada') return {pill:'pill-success', label:'Aprovada'};
  return {pill:'pill-danger', label:'Recusada'};
}

var ESCALAS = [
  {v:1,    nome:'Padrão', dica:'tamanho original das telas.'},
  {v:1.15, nome:'Grande', dica:'bom para quem força a vista para ler valores.'},
  {v:1.3,  nome:'Maior',  dica:'letras e botões bem destacados.'},
  {v:1.5,  nome:'Máximo', dica:'baixa visão — mostra menos conteúdo por tela.'}
];
function escalaAtual(){
  for(var i=0;i<ESCALAS.length;i++){ if(Math.abs(ESCALAS[i].v-state.escala)<0.001) return ESCALAS[i]; }
  return ESCALAS[0];
}

function calcularNudge(valor){
  var t = tutelado();
  var abertas = t.metas.filter(function(g){ return !g.concluida; })
                       .sort(function(a,b){ return (b.dep/b.total)-(a.dep/a.total); });
  var meta = abertas[0] || null;
  var ganhoSemanal = t.tarefas.reduce(function(acc,x){ return acc + x.recompensa; }, 0);
  if(ganhoSemanal<=0){ ganhoSemanal = 5; }
  var semanas = Math.max(1, Math.ceil(valor / ganhoSemanal));
  var restante = meta ? Math.max(0, meta.total - meta.dep) : 0;
  return {
    meta: meta,
    semanas: semanas,
    restante: restante,
    sobra: Math.max(0, t.saldo - valor),
    comprometeSaldo: valor > t.saldo
  };
}

function field(name,label,type,value,opts){
  opts = opts || {};
  var extra = '';
  if(type==='number'){ extra += ' min="'+(opts.min!==undefined?opts.min:'0')+'" step="'+(opts.step||'0.01')+'" inputmode="decimal"'; }
  if(opts.max!==undefined){ extra += ' max="'+opts.max+'"'; }
  var tag = type==='textarea'
    ? '<textarea id="mf-'+name+'" name="'+name+'"></textarea>'
    : '<input id="mf-'+name+'" name="'+name+'" type="'+type+'" value="'+(value!==undefined?esc(value):'')+'"'+extra+'>';
  var hint = opts.hint ? '<div class="hint">'+esc(opts.hint)+'</div>' : '';
  return '<div class="field"><label for="mf-'+name+'">'+esc(label)+'</label>'+tag+hint+'</div>';
}
function sheetWrap(title, inner){

      inner +
    '</div>' +
  '</div>';
}

function aplicarPreferencias(){
  var root = document.documentElement;
  var escuro = state.tema==='dark' || (state.tema==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  root.setAttribute('data-theme', escuro ? 'dark' : 'light');
  root.setAttribute('data-cb', state.daltonismo);
  root.style.setProperty('--ui', String(state.escala));
}
function render(){
  var app=document.getElementById('app');
  var screenChanged = renderedScreen !== state.screen;
  aplicarPreferencias();
  var isAdult = state.areaAtual==='adulto' && state.screen!=='login' && state.screen!=='cadastro';
  var classeIdade = (state.areaAtual==='kids') ? ' '+ui().classe : '';
  var classeEscala = state.escala>=1.3 ? ' ui-xl' : (state.escala>=1.15 ? ' ui-lg' : '');
  app.className = 'app-shell' + (isAdult ? ' theme-adult' : '') + classeIdade + classeEscala + (screenChanged ? ' screen-transition' : '');
  var html='';
  switch(state.screen){
    case 'login': html=screenLogin(); break;
    case 'cadastro': html=screenCadastro(); break;
    case 'recuperar-senha': html=screenRecuperarSenha(); break;
    case 'vincular-crianca': html=screenVincularCrianca(); break;
    case 'err404': html=screen404(); break;
    case 'kids-inicio': html=screenKidsInicio(); break;
    case 'kids-metas': html=screenKidsMetas(); break;
    case 'kids-tarefas': html=screenKidsTarefas(); break;
    case 'kids-solicitacoes': html=screenKidsSolicitacoes(); break;
    case 'kids-perfil': html=screenKidsPerfil(); break;
    case 'kids-avatar': html=screenKidsAvatar(); break;
    case 'adulto-solicitacoes': html=screenAdultoSolicitacoes(); break;
    case 'adulto-relatorio': html=screenAdultoRelatorio(); break;
    case 'adulto-perfil': html=screenAdultoPerfil(); break;
    case 'adulto-personalizar': html=screenAdultoPersonalizar(); break;
    case 'acessibilidade': html=screenAcessibilidade(); break;
    case 'kids-assistente': html=screenKidsAssistente(); break;
    case 'adulto-privacidade': html=screenPrivacidade(); break;
    default: html=screen404();
  }
  if(state.modal){ html += modalHtml(state.modal.kind, state.modal.ctx||{}); }
  app.innerHTML = html;
  renderedScreen = state.screen;
}

function previewFoto(event) {
  var input = event.target;
  if (input.files && input.files[0]) {
    var reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('foto-preview-wrap').innerHTML = 
        '<img src="' + e.target.result + '" style="max-width:100%;max-height:180px;border-radius:12px;margin-bottom:8px;" />' +
        '<br><button class="btn btn-secondary btn-sm" onclick="document.getElementById(\'foto-input\').click()">Trocar foto</button>';
    }
    reader.readAsDataURL(input.files[0]);
  }
}

  var action = target.getAttribute('data-action');

  if(action==='go'){ go(target.getAttribute('data-screen')); return; }
  if(action==='toggle-notif'){ state.notifOpen=!state.notifOpen; render(); return; }

    tutelado().saldoCorId=idCor; tutelado().saldoCor=idCor==='padrao'?'':paleta[idCor]; render(); return;
  }
  if(action==='limpar-notificacoes'){ db.notificacoes=[]; state.notifOpen=true; render(); toast('Notificações limpas.'); return; }
  if(action==='salvar-responsavel'){ var rn=val('mf-resp-nome'), ra=val('mf-resp-apelido'), re=val('mf-resp-emoji'); if(!rn||!ra){toast('Preencha nome e apelido.');return;} db.responsavel.nome=rn; db.responsavel.apelido=ra.replace(/^@/,''); db.responsavel.emoji=re||db.responsavel.emoji; state.modal=null; render(); toast('Perfil atualizado!'); return; }
  if(action==='toggle-senha'){ state.senhaVisivel=!state.senhaVisivel; render(); return; }
  if(action==='esqueci-senha'){ go('recuperar-senha'); return; }
  if(action==='demo-login'){
    var area = target.getAttribute('data-area');
    state.areaAtual = area;
    go(area==='kids' ? 'kids-inicio' : 'adulto-solicitacoes'); return;
  }
  if(action==='toggle-goal'){ var id=target.getAttribute('data-id'); state.expandedGoal = (state.expandedGoal===id? null : id); render(); return; }
  if(action==='avatar-cor'){ tutelado().corAvatar = target.getAttribute('data-cor'); render(); return; }
  if(action==='avatar-animal'){ tutelado().emoji = target.getAttribute('data-emoji'); render(); return; }
  if(action==='salvar-apelido'){ var apelidoKid=val('kids-apelido'); if(!tutelado().permitirApelido){toast('A alteração do apelido está desativada pelo responsável.');return;} if(!apelidoKid){toast('Digite um apelido antes de salvar.');return;} tutelado().apelido=apelidoKid; toast('Apelido atualizado!'); render(); return; }
  if(action==='avatar-roupa'){ tutelado().roupa = target.getAttribute('data-roupa'); render(); return; }
  if(action==='toggle-apelido'){ tutelado().permitirApelido=target.checked; render(); toast(target.checked?'A criança poderá alterar o apelido.':'A alteração do apelido foi desativada.'); return; }
  if(action==='troca-tutelado'){ return; }

  if(action==='toggle-tema'){
    var escuroAgora = document.documentElement.getAttribute('data-theme')==='dark';
    state.tema = escuroAgora ? 'light' : 'dark';
    render(); toast(state.tema==='dark' ? 'Tema escuro ativado com sucesso.' : 'Tema claro ativado.'); return;
  }
  if(action==='set-tema'){
    state.tema = target.getAttribute('data-tema');
    render();
    toast(state.tema==='auto' ? 'O tema vai seguir o seu aparelho.' : (state.tema==='dark'?'Tema escuro ativado.':'Tema claro ativado.'));
    return;
  }
  if(action==='set-escala'){
    state.escala = parseFloat(target.getAttribute('data-escala'));
    render();
    toast('Tamanho da interface: '+Math.round(state.escala*100)+'%.'); return;
  }
  if(action==='set-daltonismo'){
    state.daltonismo = target.getAttribute('data-tipo') || 'nenhum';
    render(); toast(state.daltonismo==='nenhum' ? 'Paleta padrão ativada.' : 'Adaptação para '+state.daltonismo+' ativada.'); return;
  }
  if(action==='sair'){
    state.areaAtual=null; state.modal=null; state.notifOpen=false; state.tuteladoId=db.tutelados[0].id;
    go('login'); toast('Você saiu da conta.'); return;
  }

  if(action==='modal'){
    var ctx={}; if(target.hasAttribute('data-id')) ctx.id=target.getAttribute('data-id'); if(target.hasAttribute('data-op')) ctx.op=target.getAttribute('data-op');
    state.modal={kind:target.getAttribute('data-modal'), ctx:ctx}; render(); return;
  }
  if(action==='close-modal'){ state.modal=null; render(); return; }
  if(action==='overlay-close'){
    if(e.target.closest('[data-stop]')) return;
    state.modal=null; render(); return;
  }

  if(action==='req-aprovar'){ setReqStatus(target.getAttribute('data-id'),'processando'); toast('Solicitação aprovada — aguardando confirmação de consumo.'); return; }
  if(action==='req-recusar'){ setReqStatus(target.getAttribute('data-id'),'recusada'); toast('Solicitação recusada.'); return; }
  if(action==='req-confirmar'){ setReqStatus(target.getAttribute('data-id'),'aprovada'); toast('Conclusão confirmada!'); return; }

  if(action==='enviar-prova-real'){
    var id = target.getAttribute('data-id');
    var fileInput = document.getElementById('foto-input');
    if(!fileInput || !fileInput.files || fileInput.files.length === 0){
      toast('⚠️ Por favor, tire ou escolha uma foto antes de enviar!');
      return;
    }
    state.modal = null; render();
    toast('🤖 Demonstração: simulando a análise da imagem no aparelho...');
    
    setTimeout(function(){
      var tk = tutelado(); 
      var task = tk.tarefas.find(function(x){return x.id===id;});
      if(task){ 
        task.status = 'concluida'; 
        tk.saldo += task.recompensa; 
        toast('✅ Visão Computacional: Tarefa validada com sucesso! +'+brl(task.recompensa)); 
        render(); 
      }
    }, 1600);
    return;
  }

  if(action==='salvar-meta'){
    var nome=val('mf-nome'), descricao=val('mf-descricao'), total=parseFloat(val('mf-total'));
    if(!nome){ toast('Dê um nome para a sua meta.'); return; }
    if(!(total>0)){ toast('O valor da meta precisa ser maior que zero.'); return; }
    tutelado().metas.push({id:'m'+Date.now(), nome:nome, descricao:descricao||'Sem descrição.', total:total, dep:0, concluida:false});
    state.modal=null; toast('Meta criada com sucesso!'); render(); return;
  }
  if(action==='confirmar-meta-valor'){
    var id=target.getAttribute('data-id'), op=target.getAttribute('data-op');
    var v=parseFloat(val('mf-valor')); var tk=tutelado();
    var g=tk.metas.find(function(x){return x.id===id;});
    if(!g){ return; }
    if(!(v>0)){ toast('Digite um valor maior que zero.'); return; }
    if(op==='depositar'){
      var maxDep = Math.min(tk.saldo, g.total-g.dep);
      if(v>maxDep){ toast('Você pode guardar no máximo '+brl(maxDep)+' agora.'); return; }
      g.dep += v; tk.saldo -= v;
      if(g.dep>=g.total){ g.concluida=true; toast('🎉 Meta concluída com sucesso!'); } else { toast('Valor guardado na meta!'); }
    } else {
      if(v>g.dep){ toast('Você só tem '+brl(g.dep)+' guardado nesta meta.'); return; }
      g.dep -= v; tk.saldo += v; g.concluida = g.dep>=g.total;
      toast('Valor devolvido ao seu saldo livre.');
    }
    state.modal=null; render(); return;
  }
  if(action==='toggle-pedido-livre'){
    tutelado().permitirPedidoLivre=!!target.checked;
    toast(tutelado().permitirPedidoLivre?'Pedidos livres ativados.':'Somente pedidos cadastrados.'); return;
  }
  if(action==='salvar-pedidos-permitidos'){
    var area=document.getElementById('lista-pedidos');
    var lista=(area?area.value:'').split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean);
    var unicos=[]; lista.forEach(function(x){if(!unicos.some(function(y){return y.toLocaleLowerCase('pt-BR')===x.toLocaleLowerCase('pt-BR');})) unicos.push(x);});
    tutelado().pedidosPermitidos=unicos; toast('Lista de pedidos permitidos atualizada.'); render(); return;
  }
  if(action==='responsavel-criar-tarefa'){
    var nt=val('mf-nome'), dt=val('mf-descricao'), rt=parseFloat(val('mf-recompensa'));
    if(!nt){toast('Informe o nome da tarefa.');return;} if(!(rt>0)){toast('Informe uma recompensa maior que zero.');return;}
    tutelado().tarefas.unshift({id:'k'+Date.now(),nome:nt,descricao:dt||'Tarefa combinada com o responsável.',recompensa:rt,status:'pendente',prazo:'Hoje',criadaPor:'responsavel'});
    toast('Tarefa atribuída a '+tutelado().nome+'.'); render(); return;
  }
  if(action==='salvar-solicitacao'){
    var n2=val('mf-nome'), d2=val('mf-descricao'), v2=parseFloat(val('mf-valor'));
    if(!n2){ toast('Escolha uma opção da lista combinada com seu responsável.'); return; }
    var atual=tutelado();
    var opcoes=atual.pedidosPermitidos||[];
    if(!atual.permitirPedidoLivre && !opcoes.some(function(x){return x.toLocaleLowerCase('pt-BR')===n2.toLocaleLowerCase('pt-BR');})){toast('Esse pedido não está na lista combinada com seu responsável.');return;}
    if(!(v2>0)){ toast('O valor precisa ser maior que zero.'); return; }
    state.pendenteSolic = {nome:n2, descricao:d2||'Sem descrição.', valor:v2};
    state.modal = {kind:'nudge', ctx:{}};
    render(); return;
  }
  if(action==='chat-perguntar'){
    var idx = parseInt(target.getAttribute('data-idx'),10);
    var pp = PERGUNTAS[idx]; if(!pp) return;
    var resposta = respostaAssistenteLivre(pp.q);
    state.chat.push({de:'crianca', texto:pp.q});
    state.chat.push({de:'bot', texto:resposta});
    render(); return;
  }
  if(action==='chat-enviar'){
    var pergunta=val('chat-livre');
    if(!pergunta){ toast('Escreva sua pergunta antes de enviar.'); return; }
    state.chat.push({de:'crianca',texto:pergunta});
    state.chat.push({de:'bot',texto:respostaAssistenteLivre(pergunta)});
    render(); return;
  }
  if(action==='chat-limpar'){ state.chat=[]; render(); return; }
  if(action==='toggle-consent'){
    var chave = target.getAttribute('data-chave');
    db.consentimentos[chave] = !db.consentimentos[chave];
    render();
    toast(db.consentimentos[chave] ? 'Permissão concedida.' : 'Permissão revogada.');
    return;
  }
  if(action==='revogar-tudo'){
    db.consentimentos.triagemImagem=false; db.consentimentos.assistente=false; db.consentimentos.relatorios=false;
    render(); toast('Todos os consentimentos foram revogados.'); return;
  }
  if(action==='nudge-confirmar'){
    var ps = state.pendenteSolic; if(!ps){ state.modal=null; render(); return; }
    var tk2 = tutelado();
    tk2.solicitacoes.unshift({id:'s'+Date.now(), nome:ps.nome, descricao:ps.descricao, valor:ps.valor, status:'pendente'});
    db.notificacoes.unshift({id:'n'+Date.now(), texto:'Nova solicitação de '+tk2.nome+': '+ps.nome+'.', lida:false});
    state.pendenteSolic=null; state.modal=null;
    toast('Pedido enviado para o responsável.'); render(); return;
  }
  if(action==='nudge-repensar'){
    state.pendenteSolic=null; state.modal=null;
    toast('Tudo bem! O pedido não foi enviado.'); render(); return;
  }
  if(action==='confirmar-add-saldo'){
    var v3=parseFloat(val('mf-valor'));
    if(!(v3>0)){ toast('Informe um valor maior que zero.'); return; }
    tutelado().saldo += v3; state.modal=null; toast('Saldo adicionado com sucesso!'); render(); return;
  }
  if(action==='confirmar-add-tutelado'){
    var n3=val('mf-nome'), i3=parseInt(val('mf-idade'),10);
    if(!n3){ toast('Informe o nome do tutelado.'); return; }
    if(!(i3>=5 && i3<=11)){ toast('A idade precisa estar entre 5 e 11 anos.'); return; }
    var emojis=['🐨','🦁','🐸','🦄','🐯','🐵','🐶'];
    var novo={id:'t'+Date.now(), nome:n3, idade:i3, emoji:emojis[db.tutelados.length%emojis.length], corAvatar:'#E3F3EC', saldo:0, roupa:'👒', pedidosPermitidos:[], metas:[], tarefas:[], solicitacoes:[]};
    db.tutelados.push(novo);
    state.tuteladoId = novo.id;
    state.modal=null; toast(n3+' foi adicionado(a)!'); render(); return;
  }
  if(action==='confirmar-editar-tutelado'){
    var id4=target.getAttribute('data-id'); var x=db.tutelados.find(function(u){return u.id===id4;});
    var novaIdade=parseInt(val('mf-idade'),10);
    if(val('mf-idade') && !(novaIdade>=5 && novaIdade<=11)){ toast('A idade precisa estar entre 5 e 11 anos.'); return; }
    x.nome=val('mf-nome')||x.nome; if(novaIdade>=5 && novaIdade<=11){ x.idade=novaIdade; }
    state.modal=null; toast('Dados atualizados!'); render(); return;
  }
  if(action==='excluir-tutelado'){
    var id5=target.getAttribute('data-id');
    if(db.tutelados.length<=1){ toast('É preciso manter ao menos um tutelado.'); return; }
    db.tutelados = db.tutelados.filter(function(u){return u.id!==id5;});
    if(state.tuteladoId===id5){ state.tuteladoId=db.tutelados[0].id; }
    toast('Tutelado removido.'); render(); return;
  }
});

document.addEventListener('change', function(e){
  if(e.target.matches('[data-action="troca-tutelado"]')){ state.tuteladoId = e.target.value; render(); }
});
document.addEventListener('submit', function(e){
  var form = e.target.closest('[data-form]'); if(!form) return;
  e.preventDefault();
  var kind = form.getAttribute('data-form');
  if(kind==='login'){
    var apelido=val('f-apelido'), senha=val('f-senha');
    if(!apelido || !senha){ toast('Informe seu apelido e sua senha.'); return; }
    state.areaAtual='kids'; go('kids-inicio'); toast('Acesso demonstrativo — entrando na área da criança.');
  }
  if(kind==='cadastro'){
    var s1=val('c-senha'), s2=val('c-senha2');
    if(s1.length<8){ toast('Use uma senha demonstrativa com pelo menos 8 caracteres.'); return; }
    if(s1!==s2){ toast('As senhas não conferem.'); return; }
    toast('Cadastro demonstrativo validado. Nenhuma conta real foi criada.'); go('login');
  }
  if(kind==='recuperar'){
    var email=val('r-email');
    if(!email){ toast('Informe o e-mail cadastrado.'); return; }
    toast('Fluxo demonstrativo: o envio de e-mail depende da integração de autenticação.'); go('login');
  }
  if(kind==='vincular'){
    var codigo=val('v-codigo');
    if(!codigo){ toast('Informe o código de convite.'); return; }
    toast('Código recebido na demonstração. A confirmação real exige validação pelo responsável e pelo servidor.'); go('cadastro');
  }
});
function val(id){ var el=document.getElementById(id); return el? el.value.trim() : ''; }
function setReqStatus(id, status){
  var t=tutelado(); var s=t.solicitacoes.find(function(x){return x.id===id;}); if(s) s.status=status; render();
}

if(window.matchMedia){
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var onChange = function(){ if(state.tema==='auto'){ aplicarPreferencias(); } };
  if(mq.addEventListener){ mq.addEventListener('change', mq.addEventListener ? mq.addEventListener('change', onChange) : mq.addListener(onChange)); }
}
render();
</script>
</body>
</html>
